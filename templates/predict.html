{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center mb-4">
    <a href="/" class="btn btn-outline-secondary btn-sm me-3">← Back</a>
    <h2 class="mb-0 fw-bold">{{ disease_display }} &mdash; Make a Prediction</h2>
</div>

<div class="card shadow-sm">
    <div class="card-body p-4">
        <p class="text-muted mb-4">Enter values for each feature below to get a prediction.</p>
        <form method="POST" action="/predict/{{ disease }}">
            <div class="row g-3">
                {% for feature in feature_names %}
                <div class="col-md-4">
                    <label class="form-label small fw-semibold" for="{{ feature }}">{{ feature }}</label>
                    <input type="number" step="any" class="form-control form-control-sm"
                           id="{{ feature }}" name="{{ feature }}" value="0" required>
                </div>
                {% endfor %}
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-success px-4">🔍 Predict</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
